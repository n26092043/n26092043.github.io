# ─── Site Settings ────────────────────────────────────────────────────────
title: "Paper Reading Notes"
tagline: "Personal research notebook & paper reading list."
description: >-
  A curated collection of research papers, summaries, and reading notes on
  machine learning, deep learning, and computing systems.
url: "https://n26092043.github.io"
baseurl: ""
lang: zh-TW
timezone: Asia/Taipei

# ─── Author ──────────────────────────────────────────────────────────────
author:
  name: "n26092043"
  github: "n26092043"
  email: "researcher@example.com"
  bio: "Exploring foundation models, algorithms, and computing."
  cv: ""                              # Optional external link to your CV or portfolio

# ─── Build & Markdown ────────────────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /posts/:slug/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3
  math_engine: false                  # Leave math untouched so MathJax renders LaTeX dynamically

paginate: 10
paginate_path: "/page:num/"

sass:
  sass_dir: _sass
  style: compressed

include:
  - _pages

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

# ─── Defaults ────────────────────────────────────────────────────────────
defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
      toc: true
      math: true
  - scope: { path: "_pages" }
    values:
      layout: page
      permalink: /:basename/
